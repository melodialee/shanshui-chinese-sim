<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>山水汉语 · 智慧仿真训练系统</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
:root{
  --ink:#1a1a2e;--ink-light:#2d2d44;
  --water:#2a6496;--water-dark:#1a4a72;--water-light:#4a8ec4;--water-pale:#d6e8f5;
  --mountain:#3d6b4f;--mountain-dark:#2a4a38;--mountain-light:#5a9a70;--mountain-pale:#d4e8da;
  --gold:#b8943e;--gold-light:#d4b56a;--gold-dark:#8a6e2e;--gold-pale:#f0e6cc;
  --vermillion:#c44438;--vermillion-light:#d86a60;
  --bg:#f5f3ee;--card:#fffdf8;--card-border:#e0d8c8;
  --text:#2c1810;--text2:#7a6b5d;--text3:#a69882;
  --shadow:0 4px 20px rgba(26,26,46,.08);
  --shadow-lg:0 12px 40px rgba(26,26,46,.12);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC','PingFang SC','Microsoft YaHei',serif;background:var(--bg);color:var(--text);line-height:1.6}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select{font-family:inherit}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;border:1px solid var(--card-border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 22px;border-radius:10px;font-size:14px;font-weight:600;transition:all .25s;letter-spacing:.5px}
.btn-p{background:linear-gradient(135deg,var(--water-dark),var(--water));color:#fff}.btn-p:hover{box-shadow:0 4px 16px rgba(42,100,150,.3);transform:translateY(-1px)}
.btn-g{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff}.btn-g:hover{box-shadow:0 4px 16px rgba(184,148,62,.4)}
.btn-s{background:var(--bg);color:var(--text);border:1px solid var(--card-border)}.btn-s:hover{background:#e8e0d4}
.btn-m{background:linear-gradient(135deg,var(--mountain-dark),var(--mountain));color:#fff}.btn-m:hover{box-shadow:0 4px 16px rgba(61,107,79,.3)}
.inp{width:100%;padding:11px 16px;border:1px solid var(--card-border);border-radius:10px;font-size:14px;transition:all .2s;background:var(--card)}
.inp:focus{border-color:var(--water);outline:none;box-shadow:0 0 0 3px rgba(42,100,150,.12)}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.bw{background:var(--water-pale);color:var(--water-dark)}
.bm{background:var(--mountain-pale);color:var(--mountain-dark)}
.bg{background:var(--gold-pale);color:var(--gold-dark)}
.bv{background:rgba(196,68,56,.1);color:var(--vermillion)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ripple{0%{transform:scale(1);opacity:.4}100%{transform:scale(2.5);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fi{animation:fadeIn .4s ease}
.float{animation:float 3s ease-in-out infinite}
.ti{display:inline-flex;gap:5px;padding:8px 16px}
.ti span{width:8px;height:8px;background:var(--water);border-radius:50%;animation:pulse 1.4s infinite}
.ti span:nth-child(2){animation-delay:.2s}.ti span:nth-child(3){animation-delay:.4s}
.msg-sys{background:linear-gradient(135deg,rgba(42,100,150,.06),rgba(184,148,62,.06));color:var(--water-dark);padding:10px 20px;border-radius:24px;font-size:13px;text-align:center;max-width:85%;line-height:1.7;border:1px solid rgba(184,148,62,.12)}
.msg-tip{background:var(--gold-pale);color:var(--gold-dark);padding:10px 16px;border-radius:12px;font-size:12px;max-width:85%;line-height:1.7;border-left:3px solid var(--gold)}
.msg-user{max-width:70%;background:linear-gradient(135deg,var(--water-dark),var(--water));color:#fff;padding:12px 18px;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.7}
.msg-ai{max-width:70%;display:flex;gap:10px}
.msg-ai-body{background:var(--card);padding:12px 18px;border-radius:14px 14px 14px 4px;font-size:14px;line-height:1.7;border:1px solid var(--card-border)}
.nav-item{padding:10px 16px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:8px;transition:all .2s;cursor:pointer;color:rgba(255,255,255,.5);font-weight:500}
.nav-item.active{font-weight:700;color:#fff;background:rgba(255,255,255,.1)}
.nav-item:hover:not(.active){color:rgba(255,255,255,.75);background:rgba(255,255,255,.05)}
.scene-card{cursor:pointer;transition:all .3s}.scene-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.progress-bar{height:6px;background:rgba(42,100,150,.1);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .6s ease}
.seal{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--vermillion);color:var(--vermillion);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:700;transform:rotate(-3deg);letter-spacing:1px}
.mountain-divider{position:relative;height:32px;overflow:hidden;opacity:.08}
.mountain-divider svg{position:absolute;bottom:0;width:100%}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(42,100,150,.2);border-radius:3px}
</style>
</head>
